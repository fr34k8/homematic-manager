# The parts of a CCU's lighttpd configuration the addon depends on, and nothing else:
#
#   - /addons/... is served from /usr/local/etc/config/addons/www (on a CCU through the /www/addons
#     symlink), and is excluded from the WebUI's own proxy rules;
#   - .cgi is executed by /bin/tclsh (the firmware's cgi.conf does exactly this);
#   - /usr/local/etc/config/lighttpd/*.conf is included, which is where the addon drops hmm.conf;
#   - a `reload` is an immediate graceful restart (server.graceful-restart-bg, as on OpenCCU), so
#     a request that is running while the addon installs itself - the WebUI's own install request -
#     finishes on the old server while the new one already serves with the addon's rule.
#
# The idle timeouts are lighttpd's defaults (60 s), which is the point: the host pings a quiet
# WebSocket every 25 s, and the test leaves a socket idle for longer than that to prove it survives.

server.modules = (
    "mod_redirect",
    "mod_alias",
    "mod_proxy",
    "mod_cgi",
    "mod_setenv",
)

server.document-root = "/www"
server.port = 80
server.pid-file = "/run/lighttpd.pid"
server.errorlog = "/var/log/lighttpd-error.log"
server.upload-dirs = ("/usr/local/tmp")
server.feature-flags += ("server.graceful-restart-bg" => "enable")

index-file.names = ("index.htm", "index.html", "index.cgi")
mimetype.assign = (
    ".html" => "text/html",
    ".txt" => "text/plain",
    ".json" => "application/json",
    ".js" => "text/javascript",
    ".css" => "text/css",
    ".webp" => "image/webp",
    "" => "application/octet-stream",
)

alias.url += ("/addons" => "/usr/local/etc/config/addons/www")

# /config is where the WebUI's own CGIs live; the test's stand-in for cp_software.cgi sits there
$HTTP["url"] =~ "^/(addons|config)/" {
    cgi.assign = (".cgi" => "/usr/bin/tclsh")
}

include "/usr/local/etc/config/lighttpd/*.conf"
